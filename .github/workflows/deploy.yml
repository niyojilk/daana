name: Deploy Daana App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build 2>/dev/null || echo "No build step needed for static app"

      - name: Deploy to server
        run: |
          echo "Building static files for deployment..."
          mkdir -p dist
          cp app.js dist/
          echo "Deployment would happen here (e.g., rsync to server)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daana-app
          path: hello-app/
