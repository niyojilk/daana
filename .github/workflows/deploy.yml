name: Deploy Daana App

on:
  push:
    branches:
      - main
      - master
      - niyojilk-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Configure git for authentication
            git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

            # Load port from env file
            cd ${{ secrets.DEPLOY_PATH }}
            PORT=$(grep "^PORT=" .env 2>/dev/null | cut -d'=' -f2)
            PORT=${PORT:-8001}

            # Kill any existing processes on this port (old version of same app)
            echo "Killing any processes on port $PORT..."
            ss -tlnp | grep $PORT | awk '{print $7}' | grep ":" | cut -d'/' -f2 | xargs -r kill -9 2>/dev/null || true
            lsof -ti:$PORT | xargs -r kill -9 2>/dev/null || true

            # Kill any daana processes by name
            pkill -f "python.*server.py" 2>/dev/null || true
            pkill -f "daana" 2>/dev/null || true
            rm -f daana.pid 2>/dev/null || true

            # Wait for port to be free
            echo "Waiting 2 seconds for port to be free..."
            sleep 2

            # Remove old virtual environment
            rm -rf venv

            # Create virtual environment
            python3 -m venv venv
            source venv/bin/activate

            # Install dependencies
            pip install --upgrade pip

            # Pull latest code from GitHub
            git pull origin ${{ github.ref_name }}

            # Create .env file with port
            echo "HOST=0.0.0.0" > .env
            echo "PORT=$PORT" >> .env
            echo "DEBUG=False" >> .env

            # Create systemd service file using echo commands
            echo "[Unit]" > /etc/systemd/system/daana.service
            echo "Description=Daana App Server" >> /etc/systemd/system/daana.service
            echo "After=network.target" >> /etc/systemd/system/daana.service
            echo "" >> /etc/systemd/system/daana.service
            echo "[Service]" >> /etc/systemd/system/daana.service
            echo "Type=simple" >> /etc/systemd/system/daana.service
            echo "User=www-data" >> /etc/systemd/system/daana.service
            echo "Group=www-data" >> /etc/systemd/system/daana.service
            echo "WorkingDirectory=${{ secrets.DEPLOY_PATH }}" >> /etc/systemd/system/daana.service
            echo 'Environment="PATH=${{ secrets.DEPLOY_PATH }}/venv/bin:/usr/bin"' >> /etc/systemd/system/daana.service
            echo "ExecStart=${{ secrets.DEPLOY_PATH }}/venv/bin/python server.py" >> /etc/systemd/system/daana.service
            echo "Restart=always" >> /etc/systemd/system/daana.service
            echo "RestartSec=5" >> /etc/systemd/system/daana.service
            echo "StandardOutput=syslog" >> /etc/systemd/system/daana.service
            echo "StandardError=syslog" >> /etc/systemd/system/daana.service
            echo "SyslogIdentifier=daana" >> /etc/systemd/system/daana.service
            echo "UMask=0002" >> /etc/systemd/system/daana.service
            echo "" >> /etc/systemd/system/daana.service
            echo "[Install]" >> /etc/systemd/system/daana.service
            echo "WantedBy=multi-user.target" >> /etc/systemd/system/daana.service

            # Set ownership
            chown -R www-data:www-data ${{ secrets.DEPLOY_PATH }}

            # Reload systemd and start service
            systemctl daemon-reload
            systemctl enable daana
            systemctl restart daana

            # Check status
            echo "Daana service status:"
            systemctl status daana -l --no-pager 2>&1 || true

            # Verify server is responding
            echo "Checking if server is running on port $PORT..."
            sleep 2
            curl -s http://127.0.0.1:$PORT | head -1 || echo "Server not yet responding"

            echo "Deployment completed at $(date)"
